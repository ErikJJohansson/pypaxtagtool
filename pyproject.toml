[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pypaxtagtool"
version = "0.2.0"
description = "Python PlantPAX tag configuration tool: read/write PlantPAX AOI config tags to a PLC, via CLI or local webapp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pycomm3==1.2.16",
    "openpyxl==3.1.5",
    "tqdm==4.70.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
